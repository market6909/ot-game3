<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방탈출: 할머니의 집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ========== 색상 토큰 ========== */
:root{
  color-scheme:light;
  --bg:#E9EFF5; --surface:#FFFFFF; --surface-2:#F3F6FA; --surface-3:#E4EBF3;
  --ink:#0E1C2F; --ink-2:#3B4B60; --ink-3:#66768B;
  --line:#D2DBE6; --line-2:#B7C4D4;
  --chrome:#0F2A4A; --chrome-2:#183C67; --on-chrome:#FFFFFF; --on-chrome-2:#A7BCD6;
  --navy-ink:#123460;
  --mint:#1DB8A4; --mint-ink:#077668; --mint-soft:#DCF4F0; --mint-line:#93DACF; --on-mint:#04261F;
  --primary:#0F2A4A; --primary-hover:#1C4676; --on-primary:#FFFFFF;
  --ok:#16865A; --ok-soft:#E0F2E9;
  --warn:#B06A05; --warn-soft:#FCEFD9;
  --bad:#C0303B; --bad-soft:#FBE3E5;
  --paper:#FFFDF7; --paper-line:#E6D2AA; --paper-ink:#8A5A06;
  --ink-stamp:#C42B36;
  --map-bg:#EEF4EA; --park:#D5E9CC; --water:#D3E6F1; --road:#CFD8E2; --road-line:#FFFFFF;
  --grid:rgba(15,42,74,.06);
  --stamp-blend:multiply;
  --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 20px rgba(15,42,74,.07);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:16px; --r:11px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1320; --surface:#101C2C; --surface-2:#152338; --surface-3:#1B2C45;
    --ink:#E7EEF7; --ink-2:#B0BED0; --ink-3:#8292A8;
    --line:#22344E; --line-2:#344B6B;
    --chrome:#060E1A; --chrome-2:#0E1C30; --on-chrome:#FFFFFF; --on-chrome-2:#8EA5C3;
    --navy-ink:#A9C7F0;
    --mint:#2BCDB8; --mint-ink:#62E2D0; --mint-soft:#0E3533; --mint-line:#1E6B62; --on-mint:#03211C;
    --primary:#2BCDB8; --primary-hover:#48DCC8; --on-primary:#03211C;
    --ok:#46C98F; --ok-soft:#0F2E21;
    --warn:#F2A945; --warn-soft:#352610;
    --bad:#FF727B; --bad-soft:#3A161B;
    --paper:#17150F; --paper-line:#4A3A1C; --paper-ink:#EBB862;
    --ink-stamp:#FF6A73;
    --map-bg:#0F1A17; --park:#163323; --water:#112A3B; --road:#22344E; --road-line:#3B5070;
    --grid:rgba(255,255,255,.045);
    --stamp-blend:normal;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1320; --surface:#101C2C; --surface-2:#152338; --surface-3:#1B2C45;
  --ink:#E7EEF7; --ink-2:#B0BED0; --ink-3:#8292A8;
  --line:#22344E; --line-2:#344B6B;
  --chrome:#060E1A; --chrome-2:#0E1C30; --on-chrome:#FFFFFF; --on-chrome-2:#8EA5C3;
  --navy-ink:#A9C7F0;
  --mint:#2BCDB8; --mint-ink:#62E2D0; --mint-soft:#0E3533; --mint-line:#1E6B62; --on-mint:#03211C;
  --primary:#2BCDB8; --primary-hover:#48DCC8; --on-primary:#03211C;
  --ok:#46C98F; --ok-soft:#0F2E21;
  --warn:#F2A945; --warn-soft:#352610;
  --bad:#FF727B; --bad-soft:#3A161B;
  --paper:#17150F; --paper-line:#4A3A1C; --paper-ink:#EBB862;
  --ink-stamp:#FF6A73;
  --map-bg:#0F1A17; --park:#163323; --water:#112A3B; --road:#22344E; --road-line:#3B5070;
  --grid:rgba(255,255,255,.045);
  --stamp-blend:normal;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}

/* ========== 기본 ========== */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.55vw + 11px,21px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.mono{font-family:var(--mono)}

/* ========== 상단 바 ========== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);color:var(--on-chrome)}
.tb-inner{display:flex;align-items:center;gap:.8rem;max-width:68rem;margin:0 auto;padding:.5rem clamp(.75rem,2vw,1.25rem);min-height:3.6rem}
.brand{display:flex;align-items:center;gap:.6rem;white-space:nowrap;flex:none}
.brand-mark{width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.brand-name{display:block;font-weight:700;font-size:.92rem;line-height:1.2}
.brand-sub{display:block;font-size:.7rem;color:var(--on-chrome-2);line-height:1.2}
.tb-right{display:flex;align-items:center;gap:.45rem;flex:none;margin-left:auto}
.pill{position:relative;display:flex;align-items:baseline;gap:.3rem;padding:.35rem .7rem;border-radius:.55rem;background:rgba(255,255,255,.08);font-size:.78rem;color:var(--on-chrome-2);white-space:nowrap}
.pill b{font-family:var(--mono);font-size:1.1rem;color:var(--on-chrome)}
.timer{display:flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.92rem;padding:.35rem .3rem;color:var(--on-chrome)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.5rem;min-width:2.5rem;padding:0 .65rem;border-radius:.55rem;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--on-chrome);cursor:pointer;font-size:.84rem;font-weight:600;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.15)}
.ibtn svg{width:1.1rem;height:1.1rem}
.ibtn.mapbtn{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.plus{position:absolute;right:.2rem;top:100%;font-family:var(--mono);font-weight:700;color:var(--mint);font-size:1.05rem;pointer-events:none;animation:plus 1.5s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1;transform:translateY(4px)}100%{opacity:0;transform:translateY(24px)}}
@media (max-width:760px){.brand-text,.ibtn .lbl,.pill .of,.timer{display:none}.tb-inner{gap:.45rem}}

/* ========== 공통 ========== */
.ws{max-width:68rem;margin:0 auto;padding:1.25rem clamp(.75rem,2vw,1.25rem) 3rem}
.main.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:clamp(1.1rem,2.4vw,1.9rem)}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1.5rem;margin-bottom:1rem}
.mtag{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:700;color:var(--mint-ink);background:var(--mint-soft);padding:.2rem .65rem;border-radius:.4rem}
.mtag.dark{background:rgba(255,255,255,.12);color:var(--mint)}
.mhead h1{font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.25;margin-top:.45rem;color:var(--navy-ink);letter-spacing:-.015em}
.mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;padding:.3rem .7rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip b{font-family:var(--mono);color:var(--ink)}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:46em}
.lead b{color:var(--ink)}
.h2{font-size:1.25rem;color:var(--navy-ink);line-height:1.35}
.q{font-size:clamp(1.1rem,1.5vw,1.25rem);font-weight:700;line-height:1.45;margin:1.1rem 0 .8rem;color:var(--ink)}
.q small{display:inline-block;margin-left:.4rem;font-size:.75rem;font-weight:600;color:var(--mint-ink);background:var(--mint-soft);padding:.12rem .5rem;border-radius:.3rem;vertical-align:.15em}
.note{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:.7rem .9rem;margin-top:1rem}
.note svg{flex:none;margin-top:.22em;color:var(--mint-ink)}
.note b{color:var(--ink)}
.keyline{margin-top:1.2rem;padding:.85rem 1rem;border-radius:var(--r);background:var(--navy-ink);color:var(--surface);font-weight:600;font-size:1rem;line-height:1.5}

/* 선택지 */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15.5rem),1fr));gap:.65rem}
.opts.list{grid-template-columns:minmax(0,1fr)}
.opt{position:relative;display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.8rem 1rem;min-height:3.8rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:1rem;line-height:1.4;cursor:pointer;transition:border-color .15s,background-color .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--mint-line)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.opt .ot{flex:1;min-width:0}
.opt .onote{display:block;font-size:.84rem;font-weight:500;color:var(--ink-2);margin-top:.3rem}
.opt .box{flex:none;width:1.6rem;height:1.6rem;border-radius:.4rem;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--on-mint);font-size:.95rem}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"] .box{background:var(--mint);border-color:var(--mint)}
.opt:disabled{cursor:default}
.opt.s-good{border-color:var(--ok);background:var(--ok-soft)}
.opt.s-good .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.s-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.s-bad .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.s-miss{border-style:dashed;border-color:var(--warn);background:var(--surface)}
.opt.s-miss .box{background:transparent;border-color:var(--warn);color:var(--warn)}
.opt.s-dim{opacity:.6;background:var(--surface)}

/* 피드백 */
.fbx{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--ok);font-size:.96rem;color:var(--ink-2);display:grid;gap:.25rem}
.fbx.no{border-left-color:var(--bad)}
.fbx b{color:var(--ink);font-size:1.02rem}
.think{display:flex;gap:.7rem;align-items:flex-start;margin-top:1rem;padding:.9rem 1rem;border-radius:var(--r);background:var(--surface-2);border:1px dashed var(--mint-line);font-size:.95rem;color:var(--ink-2)}
.think svg{flex:none;color:var(--mint-ink);width:1.3rem;height:1.3rem;margin-top:.1rem}
.think b{color:var(--mint-ink)}

/* 하단 버튼 영역 */
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1rem;margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.2rem;padding:.65rem 1.4rem;border-radius:.7rem;border:2px solid transparent;font-weight:700;font-size:1.02rem;cursor:pointer;transition:background-color .15s,border-color .15s,transform .08s;white-space:nowrap}
.btn svg{width:1.1em;height:1.1em}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover:not(:disabled){background:var(--primary-hover)}
.btn.mint{background:var(--mint);color:var(--on-mint)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.big{min-height:3.8rem;font-size:1.12rem;padding:.8rem 2rem}
.btn.wide{width:100%;margin-top:1.1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.88rem;color:var(--ink-3)}
.rstrip{display:flex;align-items:center;gap:1rem;flex:1;min-width:min(100%,18rem)}
.rpts{flex:none;display:flex;align-items:baseline;gap:.25rem;padding:.45rem .85rem;border-radius:.6rem;background:var(--mint-soft);color:var(--mint-ink);font-weight:600;white-space:nowrap}
.rpts b{font-family:var(--mono);font-size:1.5rem}
.rmsg{font-size:.98rem;color:var(--ink-2);font-weight:500}
@media (max-width:560px){.btn{white-space:normal}.actions > .btn{width:100%}}

/* 단계 블록 */
.stepblock{margin-top:1.3rem;padding-top:1.2rem;border-top:1px solid var(--line);scroll-margin-top:5.5rem}
.sb-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sb-n{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--navy-ink);color:var(--surface);font-family:var(--mono);font-weight:600;font-size:.9rem;flex:none}
.sb-head h2{font-size:1.15rem;color:var(--navy-ink)}
.sb-of{margin-left:auto;font-size:.8rem;color:var(--ink-3)}
.stepdone{margin-top:1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.stepdone summary{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;cursor:pointer;font-weight:600;list-style:none}
.stepdone summary::-webkit-details-marker{display:none}
.stepdone .sb-n{background:var(--ok);width:1.6rem;height:1.6rem;font-size:.8rem}
.sd-pts{margin-left:auto;font-family:var(--mono);font-size:.85rem;color:var(--ink-3);white-space:nowrap}
.sd-body{padding:0 .9rem .9rem}


/* ========== 카드 분류 ========== */
.hintbox{margin-top:.9rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.hintbox summary{cursor:pointer;padding:.6rem .9rem;font-weight:600;font-size:.92rem;color:var(--mint-ink);list-style:none;display:flex;align-items:center;gap:.4rem}
.hintbox summary::-webkit-details-marker{display:none}
.hintbox dl{margin:0;padding:0 .9rem .8rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem .9rem;font-size:.88rem}
.hintbox dt{font-weight:700;color:var(--ink)}
.hintbox dd{margin:0;color:var(--ink-2)}
.deckbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem;font-size:.84rem;color:var(--ink-3);margin:1rem 0 .6rem}
.dots{display:flex;gap:.3rem}
.dots i{width:.65rem;height:.65rem;border-radius:50%;background:var(--surface-3)}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--bad)}
.dots i.cur{background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.dcard{position:relative;border-radius:var(--r-lg);padding:1.15rem 1.25rem;min-height:6.6rem;display:grid;align-content:center;gap:.45rem;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:1.12rem;font-weight:600;line-height:1.5;animation:deal .35s ease-out both}
@keyframes deal{from{opacity:0;transform:translateY(12px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.dcard.ok{border-color:var(--ok);animation:pop .35s ease-out}
.dcard.no{border-color:var(--bad);animation:shake .4s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.dcard .src{justify-self:start;font-size:.72rem;font-weight:700;padding:.12rem .5rem;border-radius:.3rem;background:var(--surface-3);color:var(--ink-2)}
.dcard.bubble{grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:1rem;background:var(--surface-2)}
.bub-who{display:grid;justify-items:center;gap:.1rem;font-size:.74rem;color:var(--ink-3);font-weight:600}
.bub-who span:first-child{font-size:2.6rem;line-height:1}
.bub{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1rem}
.bub::before{content:"";position:absolute;left:-.55rem;top:50%;margin-top:-.45rem;border:.45rem solid transparent;border-right:.55rem solid var(--line);border-left:0}
.bub::after{content:"";position:absolute;left:-.46rem;top:50%;margin-top:-.4rem;border:.4rem solid transparent;border-right:.5rem solid var(--surface);border-left:0}
.dcard.flyer{background:var(--paper);border-style:dashed;border-color:var(--paper-line)}
.dcard.ticket{border-left:.45rem solid var(--mint)}
.dcard.ox{text-align:center;font-size:1.1rem}
.dcard.need{background:var(--surface-2)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8.2rem),1fr));gap:.55rem;margin-top:.9rem}
.bin{min-height:3.5rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.96rem;cursor:pointer;padding:.5rem .6rem;line-height:1.25;display:grid;gap:.15rem;place-content:center;text-align:center;transition:border-color .15s,background-color .15s,transform .08s}
.bin small{font-weight:500;font-size:.7rem;color:var(--ink-3)}
.bin:hover:not(:disabled){border-color:var(--mint);background:var(--mint-soft)}
.bin:active:not(:disabled){transform:scale(.97)}
.bin:disabled{cursor:default}
.bin.pick-no{border-color:var(--bad);background:var(--bad-soft)}
.bin.ans{border-color:var(--ok);background:var(--ok-soft)}
.bins.ox{grid-template-columns:1fr 1fr}
.bins.ox .bin{min-height:4.4rem;font-size:2rem;font-family:var(--mono)}
.dfb{margin-top:.9rem;padding:.85rem 1rem;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--ok);display:grid;gap:.25rem;animation:enter .3s ease-out both;font-size:.97rem;color:var(--ink-2)}
.dfb.no{border-left-color:var(--bad)}
.dfb b{font-size:1.02rem;color:var(--ink)}
.dnext{display:flex;justify-content:flex-end;margin-top:.9rem}
.dsum{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.45rem}
.dsum li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.6rem .8rem;border-radius:var(--r-sm);background:var(--surface-2);font-size:.92rem}
.dsum .mk{display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;color:var(--surface);font-size:.8rem}
.dsum .mk.ok{background:var(--ok)}
.dsum .mk.no{background:var(--bad)}
.dsum .an{font-weight:700;font-size:.84rem;color:var(--ok);white-space:nowrap}
@media (max-width:560px){.dsum li{grid-template-columns:auto minmax(0,1fr)}.dsum .an{grid-column:2}}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem;margin-top:1rem}
.strip div{padding:.55rem .4rem;border-radius:.55rem;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;text-align:center;line-height:1.3}
.strip div span{display:block;font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.strip .hit{background:var(--mint-soft);border-color:var(--mint);font-weight:700}
@media (max-width:560px){.strip{grid-template-columns:minmax(0,1fr)}}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.tags span{font-size:.84rem;padding:.3rem .7rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.tags span.em{background:var(--mint-soft);border-color:var(--mint-line);color:var(--mint-ink);font-weight:600}

/* ========== 방탈출 전용 토큰 ========== */

:root[data-theme="dark"]{ --wall:#18202D; --floor:#262117; --door:#6A4528; --door-2:#4A2F19; --on-door:#FFF3E4; --lock-bg:#0B1019; --lock-2:#18212E; }

.s-mint{fill:none;stroke:var(--mint);stroke-linecap:round}
.s-dash{fill:none;stroke:var(--mint);stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}
.fig-t{font-family:var(--font);font-size:15px;font-weight:600;fill:var(--ink-2);text-anchor:middle}
.svg-t{font-family:var(--font);font-weight:700;text-anchor:middle;dominant-baseline:central}
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot .ring{fill:transparent;stroke:transparent;stroke-width:4;stroke-dasharray:10 7}
.hot:hover .ring,.hot:focus .ring{stroke:var(--mint)}
.bdg{pointer-events:none}
.bdg .q{fill:var(--surface);stroke:var(--warn);stroke-width:3}
.bdg .qt{fill:var(--warn);font-family:var(--font);font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.bdg .ok{fill:var(--ok)}
.bdg .dot{fill:var(--warn)}
.bdg .pulse{fill:none;stroke:var(--warn);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:svping 1.6s ease-out infinite}

.lockled{fill:#FF6A73}
.lockled.on{fill:var(--mint)}
.figure{margin:1rem 0 0;padding:.8rem;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.figure svg{display:block;width:100%;height:auto;max-height:17rem}
.figure figcaption{font-size:.85rem;color:var(--ink-3);text-align:center;margin-top:.45rem}
.house{width:100%;max-width:32rem}
.house svg{display:block;width:100%;height:auto}
.story .house{margin:0 auto}
.escape .house{max-width:26rem}
.h-roof{fill:#6A4528} .h-body{fill:#1E2836} .h-ground{fill:#3E7D5A}

.ht-lock{fill:#9FB0C4} .ht-cur{fill:#E6FFF9} .ht-done{fill:#5A4210}

  .timer{display:flex}

}
/* ========== 결과 ========== */
.rhero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.5rem;align-items:center;background:var(--chrome);color:var(--on-chrome);border-radius:var(--r-lg);padding:clamp(1.4rem,3vw,2.4rem)}
.rhero h1{font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.28;margin:.7rem 0;letter-spacing:-.015em}
.rtitle{display:inline-block;font-weight:700;color:var(--on-mint);background:var(--mint);padding:.3rem .85rem;border-radius:.45rem}
.rtime{margin-top:.9rem;color:var(--on-chrome-2);display:flex;align-items:center;gap:.4rem;font-size:.95rem}
.rtime b{color:var(--on-chrome)}
.rscore{text-align:right}
.rscore b{display:block;font-family:var(--mono);font-size:clamp(4rem,9vw,6.4rem);line-height:1;color:var(--on-chrome)}
.rscore span{color:var(--on-chrome-2);font-size:1rem}
@media (max-width:720px){.rhero{grid-template-columns:minmax(0,1fr)}.rscore{text-align:left}}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.2rem;margin-top:1.2rem}
@media (max-width:960px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;padding:.6rem 0}
.rbar + .rbar{border-top:1px solid var(--line)}
.rbar .nm{font-weight:600;font-size:.94rem}
.rbar .nm small{display:block;font-weight:500;color:var(--ink-3);font-size:.78rem}
.rbar .pt{font-family:var(--mono);font-weight:600;align-self:center}
.rbar .track{grid-column:1/-1;height:.55rem;border-radius:999px;background:var(--surface-3);overflow:hidden}
.rbar .track i{display:block;height:100%;width:0;background:var(--mint);border-radius:inherit;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rsum ol{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.7rem}
.rsum li{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.7rem;align-items:start}
.rsum .ic{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:1.1rem}
.rsum li b{display:block;color:var(--ink)}
.rsum li span{color:var(--ink-2);font-size:.95rem}
.rquote{margin:1.2rem 0 0;padding:clamp(1.2rem,3vw,2rem);border-radius:var(--r-lg);background:var(--mint-soft);border-left:6px solid var(--mint)}
.rquote p{font-size:clamp(1.15rem,2.2vw,1.6rem);font-weight:700;line-height:1.5;color:var(--navy-ink)}
.result .stampcard{margin-top:1.2rem}

/* 모달 / 알림 */
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(5,14,26,.58);display:grid;place-items:center;padding:1rem;animation:fade .2s}
.modal{width:100%;max-width:30rem;max-height:calc(100dvh - 2rem);overflow:auto;background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:clamp(1.1rem,3vw,1.8rem);box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal h2{font-size:1.35rem;color:var(--navy-ink)}
.mdesc{color:var(--ink-2);margin-top:.4rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:.5rem;pointer-events:none;width:max-content;max-width:calc(100% - 2rem)}
.toast{background:var(--chrome);color:var(--on-chrome);padding:.75rem 1.15rem;border-radius:.7rem;font-weight:600;font-size:.94rem;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toast 2.8s ease forwards;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

  /* ================= 상태 ================= */
  function freshState(keep) {
    const order = {};
    Object.keys(OBJ).forEach((k) => {
      if (OBJ[k].kind === 'order') order[k] = shuffle(OBJ[k].steps.map((_, i) => i));
    });
    const seqOrder = {};
    ROOMS.forEach((r) => { if (r.lock.type === 'seq') seqOrder[r.id] = shuffle(r.lock.items.map((_, i) => i)); });
    return {
      screen: 'start', name: keep ? keep.name : '', room: 0, obj: null,
      solved: {}, read: {}, ps: {}, lk: {}, hintUsed: {},
      pen: 0, wrong: 0, hints: 0, penRoom: [0, 0, 0, 0, 0],
      time: 0, escaped: false, escapeTime: 0,
      bonus: { i: 0, ans: [], show: false, done: false },
      order, seqOrder, focus: null,
    };
  }
  let S = freshState();

  const puzzlesOf = (r) => r.objs.filter((o) => OBJ[o].kind !== 'note');
  const roomReady = (r) => puzzlesOf(r).every((o) => S.solved[o]);
  const lockOf = (rid) => S.lk[rid] || (S.lk[rid] = { input: [], solved: false, msg: '', wrongAnim: false });
  const pst = (id) => {
    if (S.ps[id]) return S.ps[id];
    const k = OBJ[id].kind;
    S.ps[id] = k === 'deck' ? { i: 0, ans: [], show: false } : k === 'choice' ? { pick: null, tried: [] } : k === 'order' ? { seq: [], msg: '' } : { sel: [], msg: '' };
    return S.ps[id];
  };
  const score = () => Math.max(30, 100 - S.pen);
  const bonusPts = () => S.bonus.ans.filter((a, i) => a === BONUS[i].a).length * 2;
  const keysGot = () => ROOMS.filter((r) => lockOf(r.id).solved).length;

  function penalize(n, isHint, quiet) {
    S.pen += n;
    S.penRoom[S.room] += n;
    if (isHint) S.hints += 1; else S.wrong += 1;
    const c = $('#penNum'); if (c) c.textContent = S.pen ? '−' + S.pen : '0';
    if (!quiet) toast((isHint ? '도담이 힌트 ' : '오답 ') + '−' + n + '점');
  }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    $('#toasts').appendChild(t);
    setTimeout(() => t.remove(), 2900);
  }
  function go(screen, extra) {
    S.screen = screen;
    if (extra) Object.assign(S, extra);
    renderAll(true);
  }

  function opt(o) {
    const mark = o.state === 'good' ? ICON.check : o.state === 'bad' ? ICON.x : o.state === 'miss' ? ICON.bang : (o.pressed && !o.state ? ICON.check : '');
    return `<button type="button" class="opt${o.radio ? ' radio' : ''}${o.state ? ' s-' + o.state : ''}" data-act="${o.act}" data-k="${o.k}" data-i="${o.i}" aria-pressed="${o.pressed ? 'true' : 'false'}"${o.disabled ? ' disabled' : ''}>`
      + `<span class="ot">${o.label}${o.note ? `<span class="onote">${o.note}</span>` : ''}</span>`
      + `<span class="box" aria-hidden="true">${mark}</span></button>`;
  }
  function hintBlock(id, text) {
    if (S.hintUsed[id]) return `<div class="hinttext"><span aria-hidden="true">🔊</span><span><b>도담이:</b> ${text}</span></div>`;

    const n = pz.filter((p) => S.solved[p]).length;
    const ready = n === pz.length;
    const tiles = R.objs.map((id) => {
      const O = OBJ[id];
      const isNote = O.kind === 'note';
      const solved = !isNote && S.solved[id];
      const fresh = isNote && !S.read[id];
      const badge = isNote ? (S.read[id] ? '읽음' : '단서') : solved ? '✓ 해결' : '퍼즐';
      return `<button type="button" class="objt${isNote ? ' note' : ''}${solved ? ' solved' : ''}${fresh ? ' fresh' : ''}" data-act="open-obj" data-k="${id}"><span class="oi" aria-hidden="true">${O.icon}</span><span class="on">${O.name}</span><span class="ob">${badge}</span></button>`;
    }).join('');
    return `<section class="panel">
      <header class="mhead"><div><span class="mtag">ROOM ${S.room + 1} / ${ROOMS.length}</span><h1>${R.icon} ${R.name}</h1></div><div class="mmeta"><span class="chip theme">${R.theme}</span></div></header>
      <div class="say"><span class="say-av" aria-hidden="true">🔊</span><p><b>도담이</b>${R.say}</p></div>
      ${SCENES[R.id](ready)}<p class="scene-cap">그림 속 물건을 누르거나, 아래 목록에서 골라 살펴보세요.</p>
      <div class="scene">${tiles}
        <button type="button" class="doortile${ready ? ' ready' : ''}" data-act="open-lock"${ready ? '' : ' disabled'}>
          <span class="dl"><span aria-hidden="true">${ready ? '🔓' : '🔒'}</span><span>${R.door}<small>${ready ? '자물쇠에 전원이 들어왔어요. 눌러서 비밀번호를 입력하세요.' : `퍼즐 ${n} / ${pz.length} 해결 · 모두 풀면 전원이 들어와요`}</small></span></span>
          <span class="bulbs" aria-hidden="true">${pz.map((p) => `<i class="${S.solved[p] ? 'on' : ''}"></i>`).join('')}</span>
        </button>
      </div>
    </section>`;
  }

  /* ================= 화면: 물건 ================= */
  function objHead(O) {
    return `<div class="backbar"><button type="button" class="backbtn" data-act="to-room">${ICON.back} ${ro(ROOMS[S.room].name)} 돌아가기</button></div>
      <div class="objhead"><span class="oi" aria-hidden="true">${O.icon}</span><div><span class="mtag">${O.kind === 'note' ? '단서' : '퍼즐'}</span><h1>${O.title || O.name}</h1></div></div>`;
  }
  function solvedBar() {
    return `<div class="solvedbar"><b>${ICON.check} 해결! 문의 전구에 불이 들어왔어요.</b><button type="button" class="btn primary" data-act="to-room">방으로 돌아가기</button></div>`;
  }
  function viewObj() {
    const id = S.obj, O = OBJ[id];
    let h = objHead(O);
    if (O.kind === 'note') {
      h += `<div style="margin-top:1rem">${O.body}</div><div class="actions"><span class="hint">단서는 언제든 다시 볼 수 있어요.</span><button type="button" class="btn primary" data-act="to-room">방으로 돌아가기</button></div>`;
      return `<section class="panel">${h}</section>`;
    }
    h += (O.fig || '') + `<p class="q">${O.q}</p>`;
    if (O.kind === 'deck') h += deckBody(id);
    else if (O.kind === 'choice') h += choiceBody(id);
    else if (O.kind === 'multi') h += multiBody(id);
    else if (O.kind === 'hunt') h += huntBody(id);
    else if (O.kind === 'order') h += orderBody(id);
    if (!S.solved[id]) h += hintBlock(id, O.hint);
    else h += solvedBar();
    return `<section class="panel">${h}</section>`;
  }

  function deckBody(id) {
    const D = OBJ[id], st = pst(id), n = D.items.length;
    if (S.solved[id]) {
      return `<ul class="dsum">${D.items.map((it, i) => { const ok = st.ans[i] === it.a; return `<li><span class="mk ${ok ? 'ok' : 'no'}">${ok ? ICON.check : ICON.x}</span><span>${it.t}<br><small class="hint">${it.why}</small></span><span class="an">${D.cats[it.a]}</span></li>`; }).join('')}</ul>`;
    }
    const it = D.items[st.i];
    const pick = st.show ? st.ans[st.i] : null;
    const ok = pick === it.a;
    const dots = D.items.map((x, i) => `<i class="${i < st.i || (i === st.i && st.show) ? (st.ans[i] === x.a ? 'ok' : 'no') : i === st.i ? 'cur' : ''}"></i>`).join('');
    let h = `<div class="deckbar"><span>카드 <b>${st.i + 1}</b> / ${n}</span><span class="dots" aria-hidden="true">${dots}</span></div>`;
    h += `<div class="dcard${st.show ? (ok ? ' ok' : ' no') : ''}"><span>${it.t}</span></div>`;
    h += `<div class="bins" role="group" aria-label="분류 선택">${D.cats.map((c, ci) => {
      let cls = '';
      if (st.show) { if (ci === it.a) cls = ' ans'; else if (ci === pick) cls = ' pick-no'; }
      return `<button type="button" class="bin${cls}" data-act="pick" data-k="${id}" data-i="${ci}"${st.show ? ' disabled' : ''}>${c}${D.catSub ? `<small>${D.catSub[ci]}</small>` : ''}</button>`;
    }).join('')}</div>`;
    if (st.show) {
      h += `<div class="dfb${ok ? '' : ' no'}" aria-live="polite"><b>${ok ? '정답이에요!' : `아쉬워요! 정답: ‘${D.cats[it.a]}’ (−1점)`}</b><span>${it.why}</span></div>`;
      h += `<div class="dnext"><button type="button" class="btn primary" id="deckNext" data-act="deck-next" data-k="${id}">${st.i < n - 1 ? '다음 카드' : '정리하기'}</button></div>`;
    }
    return h;
  }
  function choiceBody(id) {
    const C = OBJ[id], st = pst(id), solved = S.solved[id];
    let h = `<div class="opts list">${C.opts.map((o, i) => {
      const tried = st.tried.includes(i);
      const state = solved ? (o.ok ? 'good' : (tried ? 'bad' : 'dim')) : (tried ? 'bad' : '');
      return opt({ act: 'ch-pick', k: id, i, radio: true, label: o.t, pressed: st.pick === i || (solved && o.ok), state, note: tried ? o.n : '', disabled: solved || tried });
    }).join('')}</div>`;
    if (!solved) h += `<div class="actions"><span class="hint">고른 뒤 확인을 눌러요</span><button type="button" class="btn primary" data-act="ch-submit" data-k="${id}"${st.pick == null ? ' disabled' : ''}>확인</button></div>`;
    else h += `<div class="fbx"><b>정답이에요!</b><span>${C.fb}</span></div>`;
    return h;
  }
  function multiBody(id) {
    const U = OBJ[id], st = pst(id), solved = S.solved[id];
    let h = `<div class="opts list">${U.items.map((it, i) => {
      const sel = st.sel.includes(i);
      return opt({ act: 'mu-toggle', k: id, i, label: it.t, pressed: sel, state: solved ? (it.ok ? 'good' : 'dim') : '', note: solved ? it.n : '', disabled: solved });
    }).join('')}</div>`;
    if (!solved) {
      if (st.msg) h += `<div class="msg">${st.msg}</div>`;
      h += `<div class="actions"><span class="hint">${st.sel.length}개 선택됨</span><button type="button" class="btn primary" data-act="mu-submit" data-k="${id}"${st.sel.length ? '' : ' disabled'}>확인</button></div>`;
    } else {
      h += `<div class="fbx"><b>정답이에요!</b><span>${U.fb}</span></div>`;
    }
    return h;
  }
  function huntBody(id) {
    const H = OBJ[id], st = pst(id), solved = S.solved[id];
    let h = `<div class="hunt" role="group" aria-label="욕실 장면">${H.items.map((it, i) => {
      const sel = st.sel.includes(i) || (solved && it.bad);
      return `<button type="button" class="ht${solved && !it.bad ? ' safe-ok' : ''}" data-act="hunt" data-k="${id}" data-i="${i}" aria-pressed="${sel}"${solved ? ' disabled' : ''}><span class="hi" aria-hidden="true">${it.e}</span><span class="hl">${it.t}</span></button>`;
    }).join('')}</div>`;
    if (!solved) {
      if (st.msg) h += `<div class="msg">${st.msg}</div>`;
      h += `<div class="actions"><span class="hint">${st.sel.length} / 5 표시</span><button type="button" class="btn primary" data-act="hunt-submit" data-k="${id}"${st.sel.length ? '' : ' disabled'}>점검 완료</button></div>`;
    } else {
      h += `<div class="hnotes">${H.items.map((it) => `<div><span class="e" aria-hidden="true">${it.e}</span><span><b>${it.t}</b> ${it.n}</span></div>`).join('')}</div><div class="fbx"><b>모두 찾았어요!</b><span>${H.fb}</span></div>`;
    }
    return h;
  }
  function orderBody(id) {
    const P = OBJ[id], st = pst(id), solved = S.solved[id];
    const pool = S.order[id];
    const seq = solved ? P.steps.map((_, i) => i) : st.seq;
    let h = `<ol class="slots">${P.steps.map((_, i) => {
      const v = seq[i];
      return `<li class="${v != null ? (solved ? 'ok' : 'fill') : ''}">${v != null ? P.steps[v] : '여기에 들어갈 단계를 누르세요'}</li>`;
    }).join('')}</ol>`;
    if (!solved) {
      h += `<div class="pool">${pool.map((si) => `<button type="button" data-act="ord-pick" data-k="${id}" data-i="${si}"${st.seq.includes(si) ? ' disabled' : ''}>${P.steps[si]}</button>`).join('')}</div>`;
      h += `<div class="rowbtns"><button type="button" class="btn ghost" data-act="ord-undo" data-k="${id}"${st.seq.length ? '' : ' disabled'}>한 칸 되돌리기</button><button type="button" class="btn ghost" data-act="ord-reset" data-k="${id}"${st.seq.length ? '' : ' disabled'}>처음부터</button></div>`;
      if (st.msg) h += `<div class="msg">${st.msg}</div>`;
      h += `<div class="actions"><span class="hint">${st.seq.length} / ${P.steps.length} 정리됨</span><button type="button" class="btn primary" data-act="ord-submit" data-k="${id}"${st.seq.length === P.steps.length ? '' : ' disabled'}>확인</button></div>`;
    } else {
      h += `<div class="fbx"><b>순서가 맞아요!</b><span>${P.fb}</span></div>`;
    }
    return h;
  }

  /* ================= 화면: 자물쇠 ================= */
  function viewLock() {
    const R = ROOMS[S.room], L = R.lock, st = lockOf(R.id);
    let pad = '';
    if (L.type === 'num') {
      const disp = L.code.split('').map((_, i) => st.input[i] != null ? `<span>${st.input[i]}</span>` : '<span class="empty">_</span>').join('');
      pad = `<div class="ldisp" aria-live="polite" aria-label="입력한 번호 ${st.input.join('')}">${disp}</div>
        <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button type="button" data-act="key" data-i="${d}">${d}</button>`).join('')}
          <button type="button" class="k-del" data-act="key-del">지우기</button><button type="button" data-act="key" data-i="0">0</button><button type="button" class="k-ok" data-act="lock-try">확인</button></div>`;
    } else if (L.type === 'seq') {
      const ord = S.seqOrder[R.id];
      pad = `<div class="seqdisp" aria-live="polite">${st.input.length ? st.input.map((i) => `<span>${L.items[i]}</span>`).join('') : '<em>버튼을 순서대로 누르세요</em>'}</div>
        <div class="seqbtns">${ord.map((i) => `<button type="button" data-act="seq" data-i="${i}"${st.input.includes(i) ? ' disabled' : ''}>${L.items[i]}</button>`).join('')}</div>
        <div class="rowbtns"><button type="button" class="btn ghost" data-act="seq-reset" style="color:var(--lock-ink);border-color:rgba(255,255,255,.3)">다시 누르기</button></div>
        <button type="button" class="btn mint" data-act="lock-try"${st.input.length === L.items.length ? '' : ' disabled'}>문 열기</button>`;
    } else {
      pad = `<div class="dirrows">${L.items.map((t, i) => `<div class="dirrow"><b>${t}</b>
          <button type="button" data-act="dir" data-i="${i}" data-k="u" aria-pressed="${st.input[i] === 'u'}" aria-label="${t} 위">↑</button>
          <button type="button" data-act="dir" data-i="${i}" data-k="d" aria-pressed="${st.input[i] === 'd'}" aria-label="${t} 아래">↓</button></div>`).join('')}</div>
        <button type="button" class="btn mint" data-act="lock-try"${L.items.every((_, i) => st.input[i]) ? '' : ' disabled'}>문 열기</button>`;
    }
    return `<section class="panel">
      <div class="backbar"><button type="button" class="backbtn" data-act="to-room">${ICON.back} ${ro(R.name)} 돌아가기</button></div>
      <div class="lockwrap">
        <div>
          <span class="mtag">자물쇠</span>
          <h1 class="h2" style="font-size:1.5rem;margin:.5rem 0 .9rem">🔐 ${L.title}</h1>
          <p class="lockq">${L.prompt}</p>
          ${hintBlock('lock-' + R.id, L.hint)}
        </div>
        <div class="lockpad${st.wrongAnim ? ' wrong' : ''}" id="lockpad">
          <div class="lhead"><span>SMART DOOR LOCK</span><span class="led" aria-hidden="true"></span></div>
          ${pad}
          <div class="lmsg" aria-live="assertive">${st.msg || ''}</div>
        </div>
      </div>
    </section>`;
  }

  /* ================= 화면: 문 열림 / 탈출 ================= */
  function viewClear() {
    const R = ROOMS[S.room], last = S.room === ROOMS.length - 1;
    const nextIcon = last ? '🌳' : ROOMS[S.room + 1].icon;
    return `<section class="panel"><div class="clear">
      <div class="doorframe" aria-hidden="true">${nextIcon}<span class="doorpanel"></span></div>
      <span class="clack">철컥!</span>
      <h1>${R.door}이 열렸어요</h1>
      <div class="learned">
        <div class="fbx"><b>자물쇠 해설</b><span>${R.lock.done}</span></div>
        <p class="keyline">🔑 ${R.name}에서 배운 것: ${R.sum}</p>
      </div>
      <button type="button" class="btn ${last ? 'mint' : 'primary'} big" data-act="next-room">${last ? '🌳 밖으로 나가기' : `${ROOMS[S.room + 1].icon} ${ro(ROOMS[S.room + 1].name)} 들어가기`}</button>
    </div></section>`;
  }
  function viewEscape() {
    const over = S.escapeTime > LIMIT;
    return `<section class="escape">
      <div class="house">${houseSVG('escape')}</div>
      <h1>탈출 성공!</h1>
      <p>${over ? '제한 시간은 넘겼지만, 끝까지 포기하지 않고 할머니의 집을 바꿔 냈어요.' : '제한 시간 안에 할머니의 집을 안전하게 바꾸고 탈출했어요.'}</p>
      <div class="estats">
        <div><span>탈출 기록</span><b>${fmt(S.escapeTime)}</b></div>
        <div><span>점수</span><b>${score()}</b></div>
        <div><span>힌트 / 오답</span><b>${S.hints} / ${S.wrong}</b></div>
      </div>
      <div class="ebtns">
        ${S.bonus.done ? '' : '<button type="button" class="btn mint big" data-act="to-bonus">🌳 보너스 스테이지 (최대 +8점)</button>'}
        <button type="button" class="btn ${S.bonus.done ? 'mint big' : 'ghost big'}" data-act="to-result">결과 보기</button>
      </div>
    </section>`;
  }
  function viewBonus() {
    const st = S.bonus, n = BONUS.length;
    let h = `<header class="mhead"><div><span class="mtag">보너스 스테이지</span><h1>🌳 대문 밖, 지역사회로</h1></div><div class="mmeta"><span class="chip">정답당 <b>+2</b>점</span></div></header>
      <p class="lead">할머니 집 밖으로 나왔어요. 이제 지역사회 이동이에요. O인지 X인지 골라 보세요.</p>`;
    if (st.done) {
      h += `<ul class="dsum">${BONUS.map((it, i) => { const ok = st.ans[i] === it.a; return `<li><span class="mk ${ok ? 'ok' : 'no'}">${ok ? ICON.check : ICON.x}</span><span>${it.t}<br><small class="hint">${it.why}</small></span><span class="an">${it.a === 0 ? 'O' : 'X'}</span></li>`; }).join('')}</ul>
        <div class="actions"><span class="rpts"><b>+${bonusPts()}</b>점 보너스</span><button type="button" class="btn primary big" data-act="to-result">결과 보기</button></div>`;
      return `<section class="panel">${h}</section>`;
    }
    const it = BONUS[st.i];
    const pick = st.show ? st.ans[st.i] : null;
    const ok = pick === it.a;
    const dots = BONUS.map((x, i) => `<i class="${i < st.i || (i === st.i && st.show) ? (st.ans[i] === x.a ? 'ok' : 'no') : i === st.i ? 'cur' : ''}"></i>`).join('');
    h += `<div class="deckbar"><span>문제 <b>${st.i + 1}</b> / ${n}</span><span class="dots" aria-hidden="true">${dots}</span></div>
      <div class="dcard ox${st.show ? (ok ? ' ok' : ' no') : ''}"><span>${it.t}</span></div>
      <div class="bins ox">${['O', 'X'].map((c, ci) => { let cls = ''; if (st.show) { if (ci === it.a) cls = ' ans'; else if (ci === pick) cls = ' pick-no'; } return `<button type="button" class="bin${cls}" data-act="bonus-pick" data-i="${ci}"${st.show ? ' disabled' : ''}>${c}</button>`; }).join('')}</div>`;
    if (st.show) {
      h += `<div class="dfb${ok ? '' : ' no'}"><b>${ok ? '정답이에요! +2점' : `아쉬워요! 정답: ${it.a === 0 ? 'O' : 'X'}`}</b><span>${it.why}</span></div>
        <div class="dnext"><button type="button" class="btn primary" id="deckNext" data-act="bonus-next">${st.i < n - 1 ? '다음 문제' : '정리하기'}</button></div>`;
    }
    return `<section class="panel">${h}</section>`;
  }

  /* ================= 화면: 결과 ================= */
  function viewResult() {
    const sc = score(), bp = bonusPts(), over = S.escapeTime > LIMIT;
    const title = sc >= 90 && !over ? '방탈출 마스터 작업치료사' : sc >= 75 ? '든든한 방탈출 작업치료사' : sc >= 60 ? '아깝다! 한 번 더 하면 마스터' : '도담이와 함께 다시 탈출해요';
    const nm = S.name.trim();
    return `<section class="result">
      <div class="rhero">
        <div>
          <span class="mtag dark">ESCAPE RECORD</span>
          <h1>${nm ? esc(nm) + ' 님,' : ''} 할머니의 집을<br>${over ? '끝까지 바꾸고 탈출했어요' : '25분 안에 탈출했어요'}</h1>
          <span class="rtitle">${title}</span>
          <div class="rstats"><span>⏱️ 탈출 기록 ${fmt(S.escapeTime)}${over ? ' (시간 초과)' : ''}</span><span>🔊 힌트 ${S.hints}회</span><span>❌ 오답 ${S.wrong}회</span>${S.bonus.done ? `<span>🌳 보너스 +${bp}점</span>` : ''}</div>
        </div>
        <div class="rscore" aria-label="점수 ${sc}점"><b id="countUp">0</b><span>/ 100점${S.bonus.done ? ` (+보너스 ${bp})` : ''}</span></div>
      </div>
      <div class="rgrid">
        <div class="panel"><h2 class="h2">방별 감점</h2>${ROOMS.map((r, i) => { const p = S.penRoom[i]; const w = Math.max(0, 100 - p * 5); return `<div class="rbar"><span class="nm">${r.icon} ${r.name}<small>${r.theme}</small></span><span class="pt">${p ? '−' + p : '감점 없음'}</span><span class="track"><i data-w="${w}"></i></span></div>`; }).join('')}</div>
        <div class="panel rsum"><h2 class="h2">방마다 기억할 것</h2><ol>${ROOMS.map((r) => `<li><span class="ic" aria-hidden="true">${r.icon}</span><div><b>${r.name}</b><span>${r.sum}</span></div></li>`).join('')}
          <li><span class="ic" aria-hidden="true">🌳</span><div><b>대문 밖</b><span>보행, 대중교통, 운전까지 지역사회 이동도 작업치료사가 함께 다루는 영역이에요.</span></div></li></ol></div>
      </div>
      <blockquote class="rquote"><p>“집을 고치는 일은 결국, 그 집에서 계속 살아갈 삶을 지키는 일이다.”</p></blockquote>
      <div class="panel mission" style="margin-top:1.2rem">
        <h2 class="h2">탈출 후 미션: 우리 집이라면?</h2>
        <p class="hint" style="margin-top:.3rem">내가 사는 집에 노인이 함께 산다면 어떤 가정환경수정을 할 수 있을지 적어 보세요.</p>
        <label>공간<textarea id="mSpace" placeholder="예: 화장실"></textarea></label>
        <label>사례<textarea id="mCase" placeholder="예: 밤에 화장실 바닥이 젖어 있어 미끄러울 수 있다"></textarea></label>
        <label>가정환경수정<textarea id="mMod" placeholder="예: 미끄럼방지 마감, 좌변기 안전손잡이, 센서등 설치(추가적 수정)"></textarea></label>
        <div class="actions"><span class="hint">작성한 내용은 저장되지 않아요. 복사하거나 캡처해서 제출하세요.</span><button type="button" class="btn ghost" data-act="copy-mission">${ICON.copy} 내용 복사하기</button></div>
      </div>
      <div class="actions"><span class="hint">이OO 할머니와 이 집은 수업용 가상 설정이에요.</span><button type="button" class="btn primary big" data-act="restart-ask">${ICON.restart} 처음부터 다시 하기</button></div>
    </section>`;
  }

  /* ================= 렌더링 ================= */
  function sig(el) {
    if (!el || !el.dataset || !el.dataset.act) return null;
    return [el.dataset.act, el.dataset.k || '', el.dataset.i || ''].join('|');
  }
  function restoreFocus(s) {
    if (!s) return;
    const [a, k, i] = s.split('|');
    const el = document.querySelector(`[data-act="${a}"]` + (k ? `[data-k="${k}"]` : '') + (i ? `[data-i="${i}"]` : ''));
    if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  }
  function renderAll(anim) { renderTop(); renderMain(anim); }
  function renderMain(anim) {
    const main = $('#main');
    const focusSig = anim ? null : sig(document.activeElement);
    const y = window.scrollY;
    const V = { start: viewStart, intro: viewIntro, room: viewRoom, obj: viewObj, lock: viewLock, clear: viewClear, escape: viewEscape, bonus: viewBonus, result: viewResult };
    main.innerHTML = (V[S.screen] || viewStart)();
    if (anim) {
      main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter');
      window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, y);
      if (S.focus) { const f = document.getElementById(S.focus); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } } }
      else restoreFocus(focusSig);
    }
    S.focus = null;
    if (S.screen === 'lock') { const st = lockOf(ROOMS[S.room].id); st.wrongAnim = false; }
    if (S.screen === 'result') {
      if (anim) countTo($('#countUp'), 0, score(), 1300); else { const c = $('#countUp'); if (c) c.textContent = String(score()); }
      requestAnimationFrame(() => requestAnimationFrame(() => { document.querySelectorAll('.track i').forEach((i) => { i.style.width = i.dataset.w + '%'; }); }));
    }
  }
  function countTo(el, from, to, dur) {
    if (!el) return;
    if (reduceMotion || from === to) { el.textContent = String(to); return; }
    const t0 = performance.now();
    const step = (t) => { const p = Math.min(1, (t - t0) / dur); el.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  let last = performance.now();
  function tick() {
    const now = performance.now();
    const dt = Math.min(2, (now - last) / 1000);
    last = now;
    if (S.escaped || !['room', 'obj', 'lock', 'clear'].includes(S.screen)) return;
    S.time += dt;
    const t = $('#tLeft'), box = $('#timerBox');
    if (t) {
      const over = S.time > LIMIT;
      t.textContent = over ? '+' + fmt(S.time - LIMIT) : fmt(LIMIT - S.time);
      if (box) box.classList.toggle('over', over);
    }
  }

  /* ================= 모달 ================= */
  function openModal(html) {
    const prev = $('#modalBack'); if (prev) prev.remove();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.id = 'modalBack';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
    document.body.appendChild(back);
    const f = back.querySelector('[data-autofocus]') || back.querySelector('button');
    if (f) f.focus();
  }
  function closeModal() { const m = $('#modalBack'); if (m) m.remove(); }

  /* ================= 동작 ================= */
  function lockWrong(st, msg) {
    st.input = [];
    st.msg = msg;
    st.wrongAnim = true;
    penalize(2, false, true);
    renderTop();
    renderMain(false);
  }
  function lockOpen() {
    const R = ROOMS[S.room];
    lockOf(R.id).solved = true;
    if (S.room === ROOMS.length - 1) { /* 마지막 방: 문 열림 화면 뒤 탈출 */ }
    go('clear');
  }

  const A = {
    'to-intro'() { go('intro'); },
    begin() { last = performance.now(); go('room', { room: 0 }); },
    'to-room'() { go('room'); },
    'open-obj'(el) { const id = el.dataset.k; if (OBJ[id].kind === 'note') S.read[id] = true; go('obj', { obj: id }); },
    door() { const R = ROOMS[S.room]; if (roomReady(R)) { A['open-lock'](); return; } const pz = puzzlesOf(R); toast(`아직 잠겨 있어요. 퍼즐 ${pz.filter((p) => S.solved[p]).length} / ${pz.length}개를 풀었어요.`); },
    'open-lock'() { if (!roomReady(ROOMS[S.room])) return; const st = lockOf(ROOMS[S.room].id); st.msg = ''; go('lock'); },
    'next-room'() {
      if (S.room < ROOMS.length - 1) { go('room', { room: S.room + 1 }); }
      else { S.escaped = true; S.escapeTime = S.time; go('escape'); }
    },
    'to-bonus'() { go('bonus'); },
    'to-result'() { go('result'); },
    full() {
      if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => toast('이 화면에서는 전체 화면을 열 수 없어요.'));
      } else if (document.exitFullscreen) document.exitFullscreen();
    },
    'restart-ask'() {
      openModal(`<h2>처음부터 다시 시작할까요?</h2><p class="mdesc">시간, 점수, 열쇠가 모두 초기화돼요.</p>
        <div class="actions"><button type="button" class="btn ghost" data-act="modal-close" data-autofocus>취소</button><button type="button" class="btn primary" data-act="restart-confirm">${ICON.restart} 다시 시작</button></div>`);
    },
    'restart-confirm'() { S = freshState({ name: S.name }); closeModal(); renderAll(true); },
    'modal-close'() { closeModal(); },

    hint(el) {
      const id = el.dataset.k;
      if (S.hintUsed[id]) return;
      S.hintUsed[id] = true;
      penalize(3, true);
      renderTop();
      renderMain(false);
    },

    /* 카드 분류 */
    pick(el) {
      const id = el.dataset.k, st = pst(id), D = OBJ[id];
      if (st.show || S.solved[id]) return;
      const c = Number(el.dataset.i);
      st.ans[st.i] = c;
      st.show = true;
      if (c !== D.items[st.i].a) { penalize(1, false, true); renderTop(); }
      S.focus = 'deckNext';
      renderMain(false);
    },
    'deck-next'(el) {
      const id = el.dataset.k, st = pst(id), D = OBJ[id];
      if (!st.show) return;
      st.show = false;
      st.i += 1;
      if (st.i >= D.items.length) { st.i = D.items.length - 1; S.solved[id] = true; toast('퍼즐 해결! 문의 전구에 불이 들어왔어요.'); }
      renderMain(false);
      if (!S.solved[id]) { const b = document.querySelector(`.bin[data-k="${id}"]`); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } } }
    },

    /* 선택형 */
    'ch-pick'(el) { const id = el.dataset.k; if (S.solved[id]) return; pst(id).pick = Number(el.dataset.i); renderMain(false); },
    'ch-submit'(el) {
      const id = el.dataset.k, st = pst(id), C = OBJ[id];
      if (S.solved[id] || st.pick == null) return;
      if (C.opts[st.pick].ok) { S.solved[id] = true; toast('퍼즐 해결! 문의 전구에 불이 들어왔어요.'); }
      else { st.tried.push(st.pick); penalize(2); renderTop(); }
      st.pick = null;
      renderMain(false);
    },

    /* 복수 선택 */
    'mu-toggle'(el) {
      const id = el.dataset.k, st = pst(id);
      if (S.solved[id]) return;
      const i = Number(el.dataset.i), at = st.sel.indexOf(i);
      if (at >= 0) st.sel.splice(at, 1); else st.sel.push(i);
      st.msg = '';
      renderMain(false);
    },
    'mu-submit'(el) {
      const id = el.dataset.k, st = pst(id), U = OBJ[id];
      if (S.solved[id] || !st.sel.length) return;
      const goodTotal = U.items.filter((x) => x.ok).length;
      const g = st.sel.filter((i) => U.items[i].ok).length;
      const b = st.sel.length - g;
      if (g === goodTotal && b === 0) { S.solved[id] = true; st.msg = ''; toast('퍼즐 해결! 문의 전구에 불이 들어왔어요.'); }
      else {
        st.msg = `아직이에요. 알맞은 방법 ${g}개를 골랐어요${b ? `. 알맞지 않은 방법이 ${b}개 섞여 있어요` : ''}${goodTotal - g ? `. 빠뜨린 방법이 ${goodTotal - g}개 있어요` : ''}. (−2점)`;
        penalize(2, false, true); renderTop();
      }
      renderMain(false);
    },

    /* 위험요인 찾기 */
    hunt(el) {
      const id = el.dataset.k, st = pst(id);
      if (S.solved[id]) return;
      const i = Number(el.dataset.i), at = st.sel.indexOf(i);
      if (at >= 0) st.sel.splice(at, 1); else st.sel.push(i);
      st.msg = '';
      renderMain(false);
    },
    'hunt-submit'(el) {
      const id = el.dataset.k, st = pst(id), H = OBJ[id];
      if (S.solved[id] || !st.sel.length) return;
      const total = H.items.filter((x) => x.bad).length;
      const g = st.sel.filter((i) => H.items[i].bad).length;
      const b = st.sel.length - g;
      if (g === total && b === 0) { S.solved[id] = true; st.msg = ''; toast('점검 완료! 문의 전구에 불이 들어왔어요.'); }
      else {
        st.msg = `고쳐야 할 곳 ${g}개를 찾았어요${b ? `. 괜찮은 물건 ${b}개를 잘못 표시했어요` : ''}${total - g ? `. 아직 ${total - g}곳이 남았어요` : ''}. (−2점)`;
        penalize(2, false, true); renderTop();
      }
      renderMain(false);
    },

    /* 순서 맞추기 */
    'ord-pick'(el) { const id = el.dataset.k, st = pst(id); if (S.solved[id]) return; const i = Number(el.dataset.i); if (!st.seq.includes(i)) st.seq.push(i); st.msg = ''; renderMain(false); },
    'ord-undo'(el) { const st = pst(el.dataset.k); st.seq.pop(); st.msg = ''; renderMain(false); },
    'ord-reset'(el) { const st = pst(el.dataset.k); st.seq = []; st.msg = ''; renderMain(false); },
    'ord-submit'(el) {
      const id = el.dataset.k, st = pst(id), P = OBJ[id];
      if (S.solved[id] || st.seq.length !== P.steps.length) return;
      const right = st.seq.filter((v, i) => v === i).length;
      if (right === P.steps.length) { S.solved[id] = true; st.msg = ''; toast('퍼즐 해결! 문의 전구에 불이 들어왔어요.'); }
      else { st.msg = `제자리에 놓인 단계는 ${right}개예요. 다시 정리해 보세요. (−2점)`; penalize(2, false, true); renderTop(); }
      renderMain(false);
    },

    /* 자물쇠 */
    key(el) {
      const R = ROOMS[S.room], st = lockOf(R.id);
      if (st.input.length >= R.lock.code.length) return;
      st.input.push(el.dataset.i);
      st.msg = '';
      renderMain(false);
    },
    'key-del'() { const st = lockOf(ROOMS[S.room].id); st.input.pop(); st.msg = ''; renderMain(false); },
    seq(el) { const st = lockOf(ROOMS[S.room].id); const i = Number(el.dataset.i); if (!st.input.includes(i)) st.input.push(i); st.msg = ''; renderMain(false); },
    'seq-reset'() { const st = lockOf(ROOMS[S.room].id); st.input = []; st.msg = ''; renderMain(false); },
    dir(el) { const st = lockOf(ROOMS[S.room].id); st.input[Number(el.dataset.i)] = el.dataset.k; st.msg = ''; renderMain(false); },
    'lock-try'() {
      const R = ROOMS[S.room], L = R.lock, st = lockOf(R.id);
      if (st.solved) return;
      if (L.type === 'num') {
        if (st.input.length !== L.code.length) { st.msg = `${L.code.length}자리를 모두 입력하세요.`; renderMain(false); return; }
        if (st.input.join('') === L.code) lockOpen(); else lockWrong(st, '삐빅! 비밀번호가 틀렸어요. (−2점)');
      } else if (L.type === 'seq') {
        if (st.input.every((v, i) => v === i)) lockOpen(); else { lockWrong(st, '삐빅! 순서가 틀렸어요. 처음부터 다시 누르세요. (−2점)'); }
      } else {
        const ok = L.code.every((v, i) => st.input[i] === v);
        if (ok) lockOpen();
        else {
          const right = L.code.filter((v, i) => st.input[i] === v).length;
          st.msg = '';
          lockWrong(st, `삐빅! ${L.items.length}개 중 ${right}개만 맞았어요. (−2점)`);
          st.input = [];
        }
      }
    },

    /* 보너스 */
    'bonus-pick'(el) { const st = S.bonus; if (st.show || st.done) return; st.ans[st.i] = Number(el.dataset.i); st.show = true; S.focus = 'deckNext'; renderMain(false); },
    'bonus-next'() {
      const st = S.bonus;
      if (!st.show) return;
      st.show = false; st.i += 1;
      if (st.i >= BONUS.length) { st.i = BONUS.length - 1; st.done = true; }
      renderMain(false);
    },

    'copy-mission'() {
      const txt = `[탈출 후 미션] ${S.name.trim() || ''}\n공간: ${($('#mSpace') || {}).value || ''}\n사례: ${($('#mCase') || {}).value || ''}\n가정환경수정: ${($('#mMod') || {}).value || ''}`;
      const fallback = () => {
        const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        toast(ok ? '복사했어요. 원하는 곳에 붙여 넣으세요.' : '복사가 막혀 있어요. 화면을 캡처해서 제출하세요.');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('복사했어요. 원하는 곳에 붙여 넣으세요.')).catch(fallback);
      else fallback();
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.input === 'name') S.name = t.value.slice(0, 16);
  });
  document.addEventListener('keydown', (e) => {
    const tg = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && tg && tg.getAttribute && tg.getAttribute('role') === 'button' && tg.tagName.toLowerCase() !== 'button' && tg.dataset && tg.dataset.act) { e.preventDefault(); tg.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (e.key === 'Escape' && $('#modalBack')) { closeModal(); return; }
    if (S.screen === 'lock' && ROOMS[S.room].lock.type === 'num' && !$('#modalBack')) {
      if (/^[0-9]$/.test(e.key)) { A.key({ dataset: { i: e.key } }); e.preventDefault(); }
      else if (e.key === 'Backspace') { A['key-del'](); e.preventDefault(); }
      else if (e.key === 'Enter') { A['lock-try'](); e.preventDefault(); }
    }
  });

  renderAll(true);
  setInterval(tick, 500);
})();
</script>
</body>
</html>
